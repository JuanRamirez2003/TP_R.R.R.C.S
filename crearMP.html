<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Crear Materia Prima</title>
  <link rel="stylesheet" href="css/crearMP.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>

<body>

  <div class="container">
    <h1>Gestión de Materias Primas</h1>

    <div class="acciones-superior">
      <button id="btnAbrirModal" class="btn-principal">Registrar Materia Prima</button>
      <button class="btn-volver" onclick="window.location.href='supervisor.html'">← Volver</button>
    </div>

    <p id="mensaje"></p>

    <input type="text" id="buscarMaterial" placeholder="🔍 Buscar material por nombre, unidad, tipo o proveedor..."
      class="buscar-input" />

    <table id="tablaMateriales" class="tabla-materiales">
      <thead>
        <tr>
          <th>Nombre</th>
          <th>Descripción</th>
          <th>Peso</th>
          <th>Tipo</th>
          <th>Stock Total</th>
          <th>Stock Mínimo</th>
          <th>Proveedor Principal</th>
          <th>Proveedor Secundario</th>
          <th>Acciones</th>
        </tr>
      </thead>
      <tbody id="tbodyMateriales">
        <!-- Se llena desde JS -->
      </tbody>
    </table>
  </div>


  <!-- MODAL FORMULARIO -->
  <div class="modal" id="modalForm">
    <div class="modal-content">
      <span class="close" id="btnCerrarModal">&times;</span>
      <h2>Registrar Nueva Materia Prima</h2>

      <form id="formMp" class="form-grid">
        <div class="form-group">
          <label for="nombre">Nombre</label>
          <input type="text" id="nombre" required />
        </div>

        <div class="form-group">
          <label for="descr">Descripción</label>
          <textarea id="descr" rows="3"></textarea>
        </div>

        <div class="form-group">
          <label for="unidad">Peso</label>
          <input type="text" id="unidad" placeholder="kg, lt, unidad, etc" />
        </div>

        <div class="form-group">
          <label for="tipo">Tipo</label>
          <input type="text" id="tipo" placeholder="Materia prima, Insumo, etc" />
        </div>

        <div class="form-group">
          <label for="id_proveedor">Proveedor Principal</label>
          <select id="id_proveedor" required></select>
        </div>

        <div class="form-group">
          <label for="id_proveedorsec">Proveedor Secundario (opcional)</label>
          <select id="id_proveedorsec">
            <option value="">-- Ninguno --</option>
          </select>
        </div>

        <button type="submit" id="btnGuardar" class="btn-guardar">Guardar</button>
      </form>
    </div>
  </div>
  <div id="modalConfirmDelete" class="modal-confirm">
    <div class="modal-content-confirm">
      <p id="mensajeConfirm"></p>
      <div class="modal-buttons-confirm">
        <button class="btn-eliminar-confirm">Eliminar</button>
        <button class="btn-cancelar">Cancelar</button>

      </div>
    </div>
  </div>

  <script src="js/crearMP.js"></script>
  <script>
    // ==================== MODAL ====================
    const modal = document.getElementById("modalForm");
    const btnAbrirModal = document.getElementById("btnAbrirModal");
    const btnCerrarModal = document.getElementById("btnCerrarModal");

    btnAbrirModal.addEventListener("click", () => (modal.style.display = "flex"));
    btnCerrarModal.addEventListener("click", () => (modal.style.display = "none"));
    window.addEventListener("click", (e) => {
      if (e.target === modal) modal.style.display = "none";
    });
  </script>
</body>

</html>
