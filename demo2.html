<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel de Demo</title>

  <style>
    /* ======= ESTILO GLOBAL ======= */
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #121212;
      color: #e0e0e0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }

    /* ======= CONTENEDOR ======= */
    .container {
      background: #1e1e1e;
      padding: 35px;
      border-radius: 12px;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.45);

      width: 90%;
      max-width: 600px;
      /* MÁS GRANDE */
      min-width: 260px;

      text-align: center;
    }

    h2 {
      color: #55a630;
      margin-bottom: 25px;
      font-size: 26px;
    }

    /* ======= LOGO ======= */
    .logo-sidebar {
      width: 100%;
      max-width: 500px;
      /* MÁS GRANDE */
      height: auto;
      display: block;
      margin: 0 auto 10px auto;
    }

    /* ======= CONTENEDOR DE BOTONES ======= */
    .botonera {
      display: grid;
      /* Responsivo */
      grid-template-columns: 1fr;
      /* Móviles: 1 columna */
      gap: 12px;
    }

    /* ======= BOTONES ======= */
    .btn {
      padding: 14px;
      font-size: 16px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      background-color: #2a2a2a;
      color: #e0e0e0;
      font-weight: bold;
      transition: 0.25s;
      width: 100%;
    }

    .btn:hover {
      background-color: #55a630;
      color: #000;
    }

    /* ======= MEDIA QUERIES ======= */

    /* Tablets → 2 columnas */
    @media (min-width: 600px) {
      .botonera {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    /* Monitores grandes → 3 columnas */
    @media (min-width: 1100px) {
      .container {
        max-width: 750px;
        padding: 45px;
      }

      .botonera {
        grid-template-columns: repeat(3, 1fr);
      }

      .logo-sidebar {
        max-width: 280px;
      }
    }

    /* Pantallas grandes (monitores) */
    @media (min-width: 1400px) {
      .container {
        max-width: 900px;
        padding: 55px;
      }

      .logo-sidebar {
        max-width: 350px;
      }
    }

    /* Pantallas muy grandes (2K en adelante) */
    @media (min-width: 1800px) {
      .container {
        max-width: 1100px;
        padding: 65px;
      }

      .logo-sidebar {
        max-width: 420px;
      }
    }



    /* --- ANIMACIÓN DE NIEVE --- */
    .snowflake {
      position: fixed;
      top: -10px;
      color: #55a630;
      font-size: 1.2em;
      user-select: none;
      pointer-events: none;
      animation: snowfall linear infinite;
      z-index: -1;
      /* Va detrás del contenido */
    }

    @keyframes snowfall {
      0% {
        transform: translateY(0);
        opacity: 1;
      }

      100% {
        transform: translateY(100vh);
        opacity: 0.4;
      }
    }
  </style>

</head>

<body>
  <div id="snow-container"></div>

  <div class="container">

    <img src="LOGOPNG.png" alt="Logo" class="logo-sidebar">
    <!--<h2>Panel de Demo</h2>-->

    <div class="botonera">
      <button class="btn" onclick="irA('rrhh.html')">Recursos Humanos</button>
      <button class="btn" onclick="irA('operario.html')">Operario</button>
      <button class="btn" onclick="irA('supervisor.html')">Supervisor</button>
      <button class="btn" onclick="irA('ventas.html')">Ventas</button>
      <button class="btn" onclick="irA('areaQuejas.html')">Área de Quejas</button>
      <button class="btn" onclick="irA('gerente.html')">Gerente General</button>
      <button class="btn" onclick="irA('ti.html')">TI</button>
      <button class="btn" onclick="irA('preparacion.html')">Preparación</button>
    </div>

  </div>

  <script>
    function irA(url) {
      window.location.href = url;
    }
  </script>
  <script>
    const snowContainer = document.getElementById("snow-container");

    function crearCopo() {
      const copo = document.createElement("div");
      copo.classList.add("snowflake");
      copo.textContent = "❄";

      // Posición aleatoria
      copo.style.left = Math.random() * 100 + "vw";

      // Duración aleatoria
      copo.style.animationDuration = (4 + Math.random() * 6) + "s";

      // Tamaño aleatorio
      copo.style.fontSize = (12 + Math.random() * 20) + "px";

      snowContainer.appendChild(copo);

      // Eliminar cuando cae
      setTimeout(() => copo.remove(), 10000);
    }

    setInterval(crearCopo, 200);
  </script>

</body>

</html>
