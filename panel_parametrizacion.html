<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Parametrización de Producción</title>
  <link rel="stylesheet" href="parametrizacion.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
  <div class="param-panel">
    <h2><i class="fas fa-sliders-h"></i> Configuración de Producción</h2>
    <form id="form-parametros" class="param-form">
      <div class="form-group">
        <label for="linea"><i class="fas fa-industry"></i> Línea de Producción</label>
        <input type="text" id="linea" name="linea" required>
      </div>
      <div class="form-group">
        <label for="producto"><i class="fas fa-box"></i> Producto</label>
        <input type="text" id="producto" name="producto" required>
      </div>
      <div class="form-group">
        <label for="velocidad"><i class="fas fa-tachometer-alt"></i> Velocidad (unidades/hora)</label>
        <input type="number" id="velocidad" name="velocidad" required>
      </div>
      <div class="form-group">
        <label for="jornada"><i class="fas fa-clock"></i> Horas de jornada laboral</label>
        <input type="number" id="jornada" name="jornada" required>
      </div>
      <div class="form-group">
        <label for="estado"><i class="fas fa-toggle-on"></i> Estado de la línea</label>
        <select id="estado" name="estado" required>
          <option value="Activa">Activa</option>
          <option value="Suspendida">Suspendida</option>
        </select>
      </div>
      <button type="submit" class="btn-guardar"><i class="fas fa-save"></i> Guardar parámetros</button>
    </form>

    <h3>Parámetros actuales</h3>
    <table id="tabla-parametros">
      <thead>
        <tr>
          <th>Línea</th>
          <th>Producto</th>
          <th>Velocidad</th>
          <th>Jornada</th>
          <th>Estado</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>
  <script src="panel_parametrizacion.js"></script>
</body>
</html>
