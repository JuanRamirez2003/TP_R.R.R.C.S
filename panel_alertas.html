<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Panel de Alertas</title>
  <link rel="stylesheet" href="css/estilo.css">
</head>
<body>
  <h2>⚠️ Panel de Alertas</h2>

  <div class="filtros">
    <input 
      type="text" 
      id="buscador" 
      placeholder="Buscar por producto, motivo o número de OP..."
    >
    <select id="filtro-estado">
      <option value="todas">Todas</option>
      <option value="vencidas">Vencidas</option>
      <option value="por-vencer">Por vencer</option>
    </select>
  </div>

  <h3 id="contador-alertas"></h3>
  <div id="contenedor-alertas" class="alertas-grid"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
  <script type="module" src="js/panel_alertas.js"></script>
</body>
</html>
