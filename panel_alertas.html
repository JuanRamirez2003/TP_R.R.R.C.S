<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>⚠️ Panel de Alertas</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
  <style>
    /* ===========================
       PANEL DE ALERTAS - ESTILO OSCURO
       =========================== */
    body {
      background-color: #0a0a0a;
      color: #c8ffc8;
      font-family: "Segoe UI", sans-serif;
      margin: 0;
      padding-top: 120px; /* espacio para la barra fija */
    }

    /* ---------- ENCABEZADO FIJO ---------- */
    header {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      background-color: #0f2f0f;
      border-bottom: 2px solid #00ff80;
      box-shadow: 0 0 15px rgba(0, 255, 128, 0.4);
      z-index: 100;
      padding: 15px 20px;
    }

    header h2 {
      color: #00ff80;
      font-size: 1.8rem;
      text-shadow: 0 0 8px #00ff80;
      text-align: center;
      margin: 0 0 10px 0;
    }

    .filtros {
      display: flex;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .filtros input,
    .filtros select {
      background-color: #101b10;
      color: #a0ffa0;
      border: 1px solid #00ff80;
      border-radius: 6px;
      padding: 8px 12px;
      font-size: 1rem;
      outline: none;
      transition: box-shadow 0.2s ease, background 0.2s ease;
    }

    .filtros input::placeholder {
      color: #66cc66;
    }

    .filtros input:focus,
    .filtros select:focus {
      box-shadow: 0 0 8px #00ff80;
      background-color: #122812;
    }

    /* ---------- Contenido ---------- */
    #contador-alertas {
      text-align: center;
      color: #88ff88;
      font-size: 1.1rem;
      margin-top: 10px;
    }

    .alertas-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 15px;
      margin: 20px;
    }

    /* ---------- Tarjetas ---------- */
    .alerta {
      background-color: #101b10;
      border-left: 6px solid;
      border-radius: 8px;
      padding: 15px;
      box-shadow: 0 0 10px rgba(0, 255, 128, 0.1);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .alerta:hover {
      transform: scale(1.03);
      box-shadow: 0 0 15px rgba(0, 255, 128, 0.3);
    }

    /* ---------- Colores según urgencia ---------- */
    .alerta.baja {
      border-color: #00ff80;
    }

    .alerta.media {
      border-color: #ffaa00;
      color: #fff4c2;
    }

    .alerta.alta {
      border-color: #ff4444;
      color: #ffcccc;
    }

    /* ---------- Responsividad ---------- */
    @media (max-width: 600px) {
      header h2 {
        font-size: 1.4rem;
      }

      .filtros {
        flex-direction: column;
        align-items: center;
      }

      .filtros input,
      .filtros select {
        width: 90%;
      }

      body {
        padding-top: 150px;
      }
      .alerta-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 1.1rem;
  margin-bottom: 6px;
  color: #a0ffa0;
}

.alerta .estado {
  font-size: 0.85rem;
  background: rgba(0, 255, 128, 0.15);
  border: 1px solid #00ff80;
  border-radius: 4px;
  padding: 2px 6px;
  text-transform: uppercase;
}

.alerta-info p {
  margin: 4px 0;
  font-size: 0.95rem;
  color: #ccffcc;
}

.alerta.alta .estado {
  border-color: #ff4444;
  background: rgba(255, 68, 68, 0.2);
}

.alerta.media .estado {
  border-color: #ffaa00;
  background: rgba(255, 170, 0, 0.2);
}
    }
  </style>
</head>
<body>
  <header>
    <h2>⚠️ Panel de Alertas</h2>
    <div class="filtros">
      <input 
        type="text" 
        id="buscador" 
        placeholder="Buscar"
      >
      <select id="filtro-estado">
        <option value="todas">Todas</option>
        <option value="vencidas">Vencidas</option>
        <option value="por-vencer">Por vencer</option>
      </select>
    </div>
  </header>

  <h3 id="contador-alertas"></h3>
  <div id="contenedor-alertas" class="alertas-grid"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
  <script type="module" src="js/panel_alertas.js"></script>
</body>
</html>
