<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Planificación Semanal de Producción</title>
  <link rel="stylesheet" href="css/ventas.css">
  <style>
    body { font-family: Arial, sans-serif; background-color: #000; color: #fff; }
    .agenda-grid { display: flex; gap: 10px; margin-top: 20px; flex-wrap: wrap; }
    .agenda-dia { border: 1px solid #444; padding: 10px; flex: 1; min-width: 120px; background-color: #111; border-radius: 8px; }
    .bloque-produccion { padding: 5px; margin: 5px 0; border-radius: 4px; color: white; cursor: pointer; text-align: center; font-weight: bold; }
    .urgente { background-color: #ff0000; }
    .alta { background-color: #ff8000; }
    .normal { background-color: #ebeb08;}
    .baja { background-color: #00cc66;  }


    .filtros { margin-bottom: 10px; display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
    .filtros label { font-weight: bold; }
    .styled-select {
      background-color: #111;
      color: #fff;
      border: 1px solid #555;
      border-radius: 6px;
      padding: 5px 10px;
      cursor: pointer;
      font-weight: bold;
      transition: 0.3s;
    }
    .styled-select:hover { border-color: #aaa; background-color: #222; }

    #btnPlanificar, #btnVolver {
      background-color: #55a630;
      color: #000;
      font-weight: bold;
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
      border: none;
      transition: 0.3s;
    }
    #btnPlanificar:hover, #btnVolver:hover { background-color: #4a8c2a; color: #fff; }

    #modalDetalle { display: none; position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.8); justify-content: center; align-items: center; z-index: 9999; }
    #contenidoDetalle { background: #1e1e1e; color: #fff; padding: 20px; width: 80%; max-width: 600px; border-radius: 8px; position: relative; }
    #cerrarModal { position: absolute; top: 10px; right: 10px; cursor: pointer; font-size: 18px; color: #fff; }
    #contenidoDetalle table { width: 100%; border-collapse: collapse; margin-top: 10px; }
    #contenidoDetalle th, #contenidoDetalle td { border: 1px solid #444; padding: 5px; text-align: left; }
    #contenidoDetalle th { background-color: #222; }



    
  </style>
</head>
<body>
<!-- Logo superior derecho -->
        <img src="logo.png" alt="Logo de la empresa" id="logoEmpresa">
  <div class="main-content">
    <h2>Planificación Semanal de Producción</h2>

    <div class="filtros">
      <label for="filtro-linea">Línea:</label>
      <select id="filtro-linea" class="styled-select">
        <option value="">Todas las líneas</option>
      </select>

      <label for="filtro-prioridad">Prioridad:</label>
      <select id="filtro-prioridad" class="styled-select">
        <option value="">Todas</option>
        <option value="urgente">Urgente</option>
        <option value="alta">Alta</option>
        <option value="normal">Normal</option>
        <option value="baja">Baja</option>
      </select>

      <button id="btnPlanificar">Generar planificación</button>
      <button id="btnVolver">Volver</button>
    </div>

    <div id="agenda-semanal" class="agenda-grid"></div>
    
<div style="
       display:none;
       position:fixed;
       top:0;
       left:0;
       width:100%;
       height:100%;
       background:rgba(0,0,0,0.5);
       z-index:9999;
       overflow-y:auto;      /* permite scroll vertical */
       padding:20px 0;
     " 
 id="modalDetalle" >
  <div style="
       background:#1e1e1e;
       color:#fff;
       padding:20px 20px 40px 20px;
       border-radius:10px;
       width:90%;
       max-width:800px;
       max-height:90vh;
       overflow-y:auto;
       box-shadow:0 4px 20px rgba(0,0,0,0.3);
       position:relative;
  " id="contenidoDetalle">
    <span id="cerrarModal" style="
          position:absolute;
          top:10px;
          right:10px;
          cursor:pointer;
          font-size:20px;
          color:#fff;
          z-index:10;
          background:rgba(0,0,0,0.3);
          padding:2px 6px;
          border-radius:50%;
    ">✖</span>
    <div id="detalleContenido"></div>
  </div>
</div>

<!-- Modal de Aviso Genérico -->
<div id="modalAviso" class="modal-aviso">
  <div class="modal-aviso-contenido">
    <h2>Aviso</h2>
    <p id="mensajeAvisoTexto">Este es un mensaje de aviso.</p>
    <button id="btnCerrarAviso">Cerrar</button>
  </div>
</div>

<!-- 🔹 Modal para ver detalle de Lote -->
<div id="modalDetalleLote" 
     style="display:none; position:fixed; top:0; left:0; width:100%; height:100%;
            background:rgba(0,0,0,0.5); justify-content:center; align-items:center; z-index:9999;">
  <div style="background:#2a2a2a; padding:20px; border-radius:10px; width:400px; max-height:80%; overflow:auto;">
    <h3 style="text-align:center;">Detalle del Lote</h3>
    <div id="contenidoModalDetalleLote"></div>
    <br>
    <button onclick="document.getElementById('modalDetalleLote').style.display='none'"
            style="background:#55a630; border:none; color:white; padding:6px 12px; border-radius:6px; cursor:pointer;">
      Cerrar
    </button>
  </div>
</div>


  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/autoPlanificacion.js"></script>
</body>
</html>
