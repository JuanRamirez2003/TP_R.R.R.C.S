<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Área de TI</title>
  <link rel="stylesheet" href="css/ventas.css">
</head>
<body>
  <div class="dashboard">
    <!-- Logo superior derecho -->
    <img src="logo.png" alt="Logo de la empresa" id="logoEmpresa">

    <!-- Menú lateral -->
    <aside class="sidebar">
      <h2>Área TI</h2>
      <ul>
        <li><button id="btnOpcion1">Modificaciones en la BD</button></li>
        <button class="btn-logout" onclick="cerrarSesion()">Cerrar sesión</button>
      </ul>
    </aside>

    <!-- Contenido principal -->
    <main class="main-content">
      <h1>Bienvenido al Área de TI</h1>

      <!-- Contenedor de la tabla -->
<div id="auditoriaContainer" class="table-wrapper" style="display:none; margin-top:20px;">
    <h2>Tabla de Auditoría</h2>
    
    <!-- Buscador -->
<input type="text" id="buscador" placeholder="Buscar en cualquier columna..." 
       style="width:100%; padding:8px; margin-bottom:10px; border-radius:4px; border:1px solid #333;">

<!-- Tabla -->
<table id="auditoriaTable">
    <thead>
        <tr>
            <th>ID</th>
            <th>Tabla</th>
            <th>Operación</th>
            <th>Usuario</th>
            <th>Rol</th>
            <th>Fecha</th>
            <th>Acción</th>
        </tr>
    </thead>
    <tbody></tbody>
</table>

<!-- Modal -->
<div id="modalDetalle" style="
    display:none;
    position:fixed;
    top:0; left:0;
    width:100%; height:100%;
    background: rgba(0,0,0,0.5);
    justify-content:center;
    align-items:center;
    z-index:1000;
">
    <div style="
        background:#fff; 
        padding:20px; 
        border-radius:8px; 
        width:450px; 
        max-height:80%; 
        overflow:auto;
    ">
        <button id="cerrarModal" style="
            float:right; 
            background:red; 
            color:#fff; 
            border:none; 
            padding:4px 8px; 
            border-radius:4px;
            cursor:pointer;
        ">X</button>
        <h3>Detalle del Registro</h3>
        <div id="modalBody" style="white-space: pre-wrap; word-wrap: break-word;"></div>
    </div>
</div>
    </div>
</div>
  <!-- Supabase JS v2 -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- JS personalizado -->
  <script src="js/ti.js"></script>
</body>
</html>
