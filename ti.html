<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Área de TI</title>
  <link rel="stylesheet" href="css/ventas.css">

  <style>
    /* Fondo del modal de auditoría */
    .modal-auditoria {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.6);
      justify-content: center;
      align-items: center;
      z-index: 9999;
    }

    /* Mostrar modal */
    .modal-auditoria.mostrar {
      display: flex;
      animation: aparecerModal 0.3s ease;
    }

    /* Contenedor del contenido */
    .modal-auditoria-contenido {
      position: relative;
      background-color: #1e1e1e;
      color: #e0e0e0;
      padding: 30px;
      border-radius: 10px;
      box-shadow: 0 0 15px rgba(85, 166, 48, 0.4);
      max-width: 90%;
      width: 1000px;
      max-height: 90%;
      overflow: auto;
      animation: scaleUp 0.25s ease-in-out;
      font-family: sans-serif;

    }

    /* Título */
    .modal-auditoria-contenido h2 {
      margin-bottom: 20px;
      color: #55a630;
      font-size: 1.6rem;
      text-align: center;
    }

    /* Tabla de auditoría */
    .modal-auditoria-contenido table {
      width: 100%;
      border-collapse: collapse;
      margin-bottom: 20px;
      font-size: 0.95rem;
    }

    .modal-auditoria-contenido th,
    .modal-auditoria-contenido td {
      padding: 10px 12px;
      border: 1px solid #333;
      text-align: left;
    }

    .modal-auditoria-contenido th {
      background-color: #2a2a2a;
      color: #a8e063;
    }

    .modal-auditoria-contenido tr:nth-child(even) {
      background-color: #2b2b2b;
    }

    .modal-auditoria-contenido tr:hover {
      background-color: #333;
    }

    /* Botón cerrar */
    .modal-auditoria-contenido .btn-cerrar {
      background-color: #4a8c2a;
      color: #000;
      border: none;
      padding: 10px 20px;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.3s;
      display: block;
      margin: 0 auto;
    }

    .modal-auditoria-contenido .btn-cerrar:hover {
      background-color: #55a630;
      color: #fff;
      transform: scale(1.05);
    }

    .btn-cerrar-x {
      position: absolute;
      top: 12px;
      right: 16px;
      background: transparent;
      border: none;
      font-size: 1.4rem;
      color: #e0e0e0;
      cursor: pointer;
      transition: 0.3s;
    }

    .btn-cerrar-x:hover {
      color: #55a630;
      transform: scale(1.2);
    }
  </style>
</head>

<body>
  <div class="dashboard">

    <!-- Menú lateral -->
    <aside class="sidebar">
       <img src="LOGOPNG.png" alt="Logo de preparación" class="logo-sidebar">

      <h2>Área TI</h2>
      <ul>
        <li><button id="btnOpcion1">Modificaciones en la BD</button></li>
        <button class="btn-logout" onclick="cerrarSesion()">Cerrar sesión</button>
      </ul>
    </aside>

    <!-- Contenido principal -->
    <main class="main-content">
      <h1>Bienvenido al Área de TI</h1>

      <!-- Contenedor de la tabla -->
      <div id="auditoriaContainer" class="table-wrapper" style="display:none; margin-top:20px;">
        <h2>Tabla de Auditoría</h2>

        <!-- Buscador -->
        <input type="text" id="buscador" placeholder="Buscar en cualquier columna..."
          style="width:100%; padding:8px; margin-bottom:10px; border-radius:4px; border:1px solid #333;">

        <!-- Tabla -->
        <table id="auditoriaTable">
          <thead>
            <tr>
              <th>ID</th>
              <th>Tabla</th>
              <th>Operación</th>
              <th>Usuario</th>
              <th>Rol</th>
              <th>Fecha</th>
              <th>Acción</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>

        <!-- Modal Auditoría <button class="btn-cerrar" onclick="cerrarModalDetalle()">Cerrar</button>-->
        <div id="modalDetalle" class="modal-auditoria">
          <div class="modal-auditoria-contenido">
            <button class="btn-cerrar-x" onclick="cerrarModalDetalle()">✖</button>

            <h2>Detalle de Auditoría</h2>
            <div id="modalBody"></div>

          </div>
        </div>




      </div>
  </div>

  </div>
  </div>

  <!-- Modal de Aviso Genérico  
   -->
  <div id="modalAviso" class="modal-aviso">
    <div class="modal-aviso-contenido">
      <h2>Aviso</h2>
      <p id="mensajeAvisoTexto">Este es un mensaje de aviso.</p>
      <button id="btnCerrarAviso">Cerrar</button>
    </div>
  </div>

  <!-- Supabase JS v2 -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- JS personalizado -->
  <script src="js/ti.js"></script>
</body>

</html>
